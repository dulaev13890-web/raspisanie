<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1734">
<title>Конструктор расписания уроков</title>
<style>
:root {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #f8fbff;
  box-sizing: border-box;
  --blue: #7dd3fc;
  --blue-light: #b9edff;
  --glass: #ffffff14;
  --line: #d4efff38;
}
*, *:before, *:after { box-sizing: inherit; }
html { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background: #07152f;
}
button, input { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid #fcd34d; outline-offset: 2px; }

/* Движущийся фон: светящиеся пятна, сетка и символы */
.animated-background {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  background:
    radial-gradient(circle at 15% 20%, #1e70c766, transparent 28%),
    radial-gradient(circle at 86% 75%, #04a6c766, transparent 30%),
    linear-gradient(135deg, #07152f 0%, #12386b 50%, #061a35 100%);
  background-size: 150% 150%;
  animation: backgroundMove 18s ease-in-out infinite alternate;
}
.animated-background::before {
  content: "";
  position: absolute;
  inset: -50%;
  opacity: .22;
  background-image:
    linear-gradient(#8edcff22 1px, transparent 1px),
    linear-gradient(90deg, #8edcff22 1px, transparent 1px);
  background-size: 58px 58px;
  transform: rotate(8deg) scale(1.3);
  animation: gridMove 22s linear infinite;
}
.animated-background::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 22%, #020b1f88 100%);
  pointer-events: none;
}
@keyframes backgroundMove {
  0% { background-position: 0% 40%; }
  50% { background-position: 100% 60%; }
  100% { background-position: 20% 100%; }
}
@keyframes gridMove {
  from { transform: rotate(8deg) translate3d(0, 0, 0) scale(1.3); }
  to { transform: rotate(8deg) translate3d(58px, 58px, 0) scale(1.3); }
}
.symbols {
  position: absolute;
  inset: 0;
  overflow: hidden;
  color: #a6eaff;
  font-family: Georgia, serif;
  font-weight: 700;
  user-select: none;
}
.symbols span {
  position: absolute;
  display: block;
  opacity: 0;
  text-shadow: 0 0 12px #54d9ff, 0 0 28px #2788ff;
  animation: floatSymbol linear infinite;
}
.symbols span:nth-child(1) { left: 5%; font-size: 30px; animation-duration: 13s; animation-delay: -3s; }
.symbols span:nth-child(2) { left: 14%; font-size: 22px; animation-duration: 17s; animation-delay: -11s; }
.symbols span:nth-child(3) { left: 27%; font-size: 38px; animation-duration: 19s; animation-delay: -7s; }
.symbols span:nth-child(4) { left: 39%; font-size: 20px; animation-duration: 15s; animation-delay: -14s; }
.symbols span:nth-child(5) { left: 52%; font-size: 34px; animation-duration: 18s; animation-delay: -5s; }
.symbols span:nth-child(6) { left: 66%; font-size: 24px; animation-duration: 14s; animation-delay: -9s; }
.symbols span:nth-child(7) { left: 76%; font-size: 42px; animation-duration: 21s; animation-delay: -16s; }
.symbols span:nth-child(8) { left: 89%; font-size: 27px; animation-duration: 16s; animation-delay: -4s; }
.symbols span:nth-child(9) { left: 96%; font-size: 19px; animation-duration: 20s; animation-delay: -12s; }
@keyframes floatSymbol {
  0% { transform: translateY(110vh) rotate(0deg) scale(.7); opacity: 0; }
  12% { opacity: .28; }
  50% { opacity: .16; }
  88% { opacity: .25; }
  100% { transform: translateY(-20vh) rotate(360deg) scale(1.1); opacity: 0; }
}
.orb {
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  filter: blur(7px);
  opacity: .2;
  background: #36d7ff;
  animation: orbFloat 16s ease-in-out infinite alternate;
}
.orb.one { top: 10%; left: -100px; }
.orb.two { right: -100px; bottom: 8%; background: #446cff; animation-delay: -7s; animation-duration: 21s; }
@keyframes orbFloat {
  to { transform: translate(120px, 80px) scale(1.35); opacity: .35; }
}

.shell {
  position: relative;
  max-width: 1680px;
  margin: auto;
  padding: 24px clamp(16px, 3vw, 48px) 56px;
}
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
.eyebrow { color: #9dd9ff; font-weight: 700; font-size: .85rem; letter-spacing: .05em; text-transform: uppercase; }
.top h1 { font-size: clamp(1.8rem, 3vw, 2.7rem); margin: 4px 0; letter-spacing: -.02em; }
.top p { margin: 0; color: #d2e9ff; }
.layout { display: grid; grid-template-columns: minmax(345px, 465px) minmax(0, 1fr); gap: 22px; align-items: start; }
.editor { display: grid; gap: 16px; }
.card, .preview-panel {
  border: 1px solid var(--line);
  border-radius: 22px;
  background: linear-gradient(135deg, #ffffff20, #ffffff0b);
  box-shadow: 0 14px 48px #020d2042, inset 0 1px #ffffff22;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.card { padding: 20px; }
.card h2 { font-size: 1.15rem; margin: 0 0 14px; }
.label { display: block; font-size: .94rem; font-weight: 650; margin: 0 0 8px; }
.add-row { display: flex; gap: 9px; }
.field { width: 100%; min-width: 0; min-height: 48px; border: 1px solid #c8e8ff7e; border-radius: 12px; background: #071c39ac; color: #fff; padding: 10px 12px; }
.field::placeholder { color: #bdd6e8; }
.btn { min-height: 46px; border: 1px solid transparent; border-radius: 12px; padding: 10px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; transition: transform .18s ease, box-shadow .18s ease, filter .18s ease; }
.btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
.btn:active { transform: translateY(0); }
.btn-main { background: linear-gradient(135deg, #8de4ff, #4da9ff); color: #08203b; box-shadow: 0 7px 22px #38bdf866; }
.btn-light { background: #e9f5ff; color: #123253; }
.btn-line { border-color: #a9dafa8c; background: #133b6066; color: #fff; }
.btn-danger { border-color: #ffc3cb; background: #8f2340; color: #fff; }
.wide { width: 100%; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.tab { border: 1px solid #b3dcfa70; border-radius: 99px; background: #0b2b51b3; color: #fff; padding: 9px 16px; min-height: 44px; font-weight: 650; transition: .18s; }
.tab:hover { transform: translateY(-2px); }
.tab.active { background: #8ddcff; color: #0b2945; box-shadow: 0 0 22px #4dccff88; }
.class-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px; }
.class-head h2 { margin: 0; }
.class-head .btn { font-size: .86rem; flex-shrink: 0; }
.lesson { display: grid; grid-template-columns: 26px minmax(0, 1fr) 58px 34px; align-items: end; gap: 6px; padding: 10px 0; border-top: 1px solid #ffffff30; }
.lesson-num { padding-bottom: 12px; font-weight: 800; color: #9cddff; text-align: center; }
.lesson .field { padding: 8px 6px; text-align: left; }
.lesson .room-field { text-align: center; padding: 8px 4px; }
.lesson-remove { width: 34px; height: 34px; min-height: 34px; padding: 0; font-size: 1.15rem; line-height: 1; border-radius: 8px; align-self: center; margin-bottom: 2px; }
.hint, .status { color: #d3e9f7; font-size: .9rem; line-height: 1.5; }
.status { min-height: 1.5em; margin: 0; }
.preview-panel { padding: 20px; position: sticky; top: 20px; }
.preview-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.preview-head h2 { margin: 0; font-size: 1.15rem; }
.preview-head span { font-size: .85rem; color: #d7ecfa; }
.paper-scroll { overflow: auto; border-radius: 12px; }
.paper { width: 100%; aspect-ratio: 297 / 210; min-height: 380px; background: #fff; color: #182336; border-radius: 5px; padding: clamp(14px, 2vw, 34px); box-shadow: 0 12px 35px #00122966; }
.paper h3 { text-align: center; margin: 0 0 18px; font-size: clamp(16px, 1.6vw, 25px); }
.paper-empty { margin: 15% auto 0; max-width: 28em; text-align: center; color: #64748b; line-height: 1.5; }
.schedule-table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: clamp(10px, .86vw, 15px); }
.schedule-table col.col-num { width: 34px; }
.schedule-table col.col-room { width: 44px; }
.schedule-table col.col-subject { width: auto; }
.schedule-table th, .schedule-table td { border: 1px solid #8da0b4; padding: 6px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
.schedule-table th { background: #edf4fa; text-align: center; font-weight: 700; }
.schedule-table .number-cell { text-align: center; font-weight: 700; }
.schedule-table .room-cell { width: 44px; max-width: 44px; text-align: center; padding: 6px 2px; }
.schedule-table .subject-cell { text-align: left; padding-left: 6px; }
.overlay { position: fixed; inset: 0; display: grid; place-items: center; background: #07172ae3; padding: 16px; z-index: 10; }
.dialog { max-width: 420px; width: 100%; padding: 24px; border: 1px solid #9fd7f4; border-radius: 20px; background: #163051; box-shadow: 0 20px 60px #0009; }
.dialog h2 { margin: 0 0 12px; }
.dialog p { line-height: 1.5; }
.dialog-actions { display: flex; gap: 10px; }
.dialog-actions .btn { flex: 1; }
[hidden] { display: none !important; }
@media (max-width: 950px) { .layout { grid-template-columns: 1fr; } .preview-panel { display: none; } .shell { max-width: 620px; padding-top: 20px; } .top { margin-bottom: 19px; } }
@media (max-width: 370px) { .lesson { grid-template-columns: 20px minmax(0, 1fr) 48px 30px; gap: 4px; } .lesson-remove { width: 30px; height: 30px; min-height: 30px; font-size: 1rem; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
@page { size: A4 landscape; margin: 10mm; }
@media print {
  html, body { background: #fff !important; color: #000 !important; animation: none; margin: 0; padding: 0; }
  .animated-background, .shell, .overlay { display: none !important; }
  #printArea { display: block !important; color: #000; }
  .print-page { width: 100%; }
  .print-page h1 { text-align: center; font-size: 16pt; margin: 0 0 6mm; }
  .print-page .schedule-table { font-size: 9.5pt; table-layout: fixed; width: 100%; }
  .print-page .schedule-table col.col-num { width: 26px !important; }
  .print-page .schedule-table col.col-room { width: 38px !important; }
  .print-page .schedule-table th, .print-page .schedule-table td { border: 1px solid #000; padding: 4px 2px; }
  .print-page .schedule-table .room-cell { width: 38px !important; max-width: 38px !important; text-align: center; padding-left: 1px !important; padding-right: 1px !important; }
  .print-page .schedule-table .number-cell { width: 26px !important; max-width: 26px !important; }
  .print-page .schedule-table th { background: #fff; }
  .print-page thead { display: table-header-group; }
  .print-page tr { break-inside: avoid; page-break-inside: avoid; }
}
</style>
</head>
<body>
<div class="animated-background" aria-hidden="true">
  <div class="symbols"><span>✦</span><span>∑</span><span>π</span><span>✧</span><span>√</span><span>∞</span><span>★</span><span>＋</span><span>λ</span></div>
  <div class="orb one"></div><div class="orb two"></div>
</div>
<div class="shell">
  <header class="top"><div><div class="eyebrow">Для школы</div><h1>Конструктор расписания</h1><p>Простое создание и печать на А4 в альбомной ориентации</p></div></header>
  <div class="layout">
    <main class="editor">
      <section class="card" aria-labelledby="classesTitle"><h2 id="classesTitle">1. Добавьте класс</h2><label class="label" for="classInput">Название класса</label><div class="add-row"><input id="classInput" class="field" placeholder="Например, 9А" maxlength="30" autocomplete="off"><button id="addClassBtn" class="btn btn-light" type="button">Добавить</button></div><div id="classTabs" class="tabs" role="group" aria-label="Классы"></div></section>
      <section class="card" id="lessonsSection" hidden><div class="class-head"><h2 id="currentClassTitle">2. Уроки</h2><button id="deleteClassBtn" class="btn btn-danger" type="button">Удалить класс</button></div><div id="lessonsList"></div><button id="addLessonBtn" class="btn btn-line wide" type="button" style="margin-top:12px;">+ Добавить урок</button></section>
      <button id="printBtn" class="btn btn-main wide" type="button">Распечатать на А4 · альбомная</button><p id="status" class="status" role="status" aria-live="polite"></p><p class="hint">Расписание автоматически сохраняется в памяти телефона.</p>
    </main>
    <aside class="preview-panel" aria-label="Предпросмотр"><div class="preview-head"><h2>Предпросмотр листа</h2><span>А4 · Альбомная</span></div><div class="paper-scroll"><div id="previewPaper" class="paper"></div></div></aside>
  </div>
</div>
<div id="modalOverlay" class="overlay" hidden><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText"><h2 id="modalTitle">Внимание! Совпадение</h2><p id="modalText"></p><div class="dialog-actions"><button id="modalConfirmBtn" class="btn btn-main" type="button">Да, всё верно</button><button id="modalCancelBtn" class="btn btn-light" type="button">Исправить</button></div></div></div>
<div id="printArea" hidden aria-hidden="true"></div>
<script>
"use strict";
const KEY = "raspisanie-urokov-v1", data = new Map(), id = name => document.getElementById(name);
let current = "", pending = null, restoreFocus = null;
function save(){try{localStorage.setItem(KEY,JSON.stringify([...data]));}catch(e){id("status").textContent="Не удалось сохранить расписание.";}}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const entries=JSON.parse(raw);if(!Array.isArray(entries))return;for(const entry of entries){if(!Array.isArray(entry)||typeof entry[0]!=="string"||!Array.isArray(entry[1]))continue;const name=entry[0].trim();if(!name||data.has(name))continue;data.set(name,entry[1].filter(x=>x&&typeof x==="object").map(x=>({name:typeof x.name==="string"?x.name:"",room:typeof x.room==="string"?x.room:""})));}}catch(e){id("status").textContent="Ошибка загрузки сохранённых данных.";}}
function addClass(){const input=id("classInput"),name=input.value.trim();if(!name){input.focus();return;}const existing=[...data.keys()].find(x=>x.toLocaleLowerCase("ru")===name.toLocaleLowerCase("ru")),selected=existing||name;if(!existing){data.set(selected,[]);save();}input.value="";selectClass(selected);id("status").textContent=existing?`Выбран класс ${selected}.`:`Класс ${selected} добавлен.`;}
function renderTabs(){const tabs=id("classTabs");tabs.replaceChildren();for(const name of data.keys()){const btn=document.createElement("button");btn.type="button";btn.className=`tab ${name===current?"active":""}`;btn.textContent=name;btn.setAttribute("aria-pressed",String(name===current));btn.addEventListener("click",()=>selectClass(name));tabs.append(btn);}}
function selectClass(name){if(pending)cancelPending();current=name;id("lessonsSection").hidden=false;id("currentClassTitle").textContent=`2. Уроки (${name})`;renderTabs();renderLessons();}
function renderLessons(){const list=id("lessonsList"),lessons=data.get(current)||[];list.replaceChildren();if(!lessons.length){const p=document.createElement("p");p.className="hint";p.textContent="Уроков пока нет. Нажмите «+ Добавить урок».";list.append(p);return;}lessons.forEach((lesson,index)=>{const row=document.createElement("div");row.className="lesson";const number=document.createElement("span");number.className="lesson-num";number.textContent=`${index+1}`;const subjInput=document.createElement("input");subjInput.className="field";subjInput.type="text";subjInput.maxLength=100;subjInput.placeholder="Предмет";subjInput.value=lesson.name;subjInput.addEventListener("input",()=>renderPreview({className:current,index,value:subjInput.value.trim()}));subjInput.addEventListener("change",()=>changeLesson(current,index,"name",subjInput));const roomInput=document.createElement("input");roomInput.className="field room-field";roomInput.type="text";roomInput.maxLength=4;roomInput.placeholder="Каб.";roomInput.value=lesson.room;roomInput.addEventListener("input",()=>{const saved=data.get(current)?.[index];if(saved){saved.room=roomInput.value.trim();save();renderPreview();}});const remove=document.createElement("button");remove.type="button";remove.className="btn btn-danger lesson-remove";remove.innerHTML="&times;";remove.title="Удалить урок";remove.setAttribute("aria-label",`Удалить урок ${index+1}`);const className=current;remove.addEventListener("click",()=>{if(pending)return;const arr=data.get(className);if(!arr||arr[index]!==lesson)return;arr.splice(index,1);save();renderLessons();renderPreview();id("status").textContent=`Урок ${index+1} удалён.`;});row.append(number,subjInput,roomInput,remove);list.append(row);});}
function changeLesson(className,index,key,input){const lesson=data.get(className)?.[index];if(!lesson||pending)return;const value=input.value.trim();input.value=value;if(key==="room"){lesson.room=value;save();renderPreview();return;}if(!value||value===lesson.name){lesson.name=value;save();renderPreview();return;}const other=[...data.entries()].find(([name,lessons])=>name!==className&&lessons[index]?.name.trim().toLocaleLowerCase("ru")===value.toLocaleLowerCase("ru"))?.[0];if(!other){lesson.name=value;save();renderPreview();return;}pending={className,index,value,input,old:lesson.name};restoreFocus=input;id("modalText").textContent=`Вы записали такой же предмет (${value}) на ${index+1}-й урок в расписании класса ${other}. Всё верно?`;id("modalOverlay").hidden=false;id("modalConfirmBtn").focus();}
function closeModal(){pending=null;id("modalOverlay").hidden=true;if(restoreFocus?.isConnected)restoreFocus.focus();restoreFocus=null;}
function cancelPending(){if(pending){pending.input.value=pending.old;closeModal();renderPreview();}}
function cell(row,tag,text,colSpan,className){const el=document.createElement(tag);el.textContent=text;if(colSpan)el.colSpan=colSpan;if(className)el.className=className;row.append(el);}
function makeTable(draft){const table=document.createElement("table");table.className="schedule-table";const colgroup=document.createElement("colgroup"),colNum=document.createElement("col");colNum.className="col-num";colgroup.append(colNum);for(let c=0;c<data.size;c++){const colSubj=document.createElement("col"),colRoom=document.createElement("col");colSubj.className="col-subject";colRoom.className="col-room";colgroup.append(colSubj,colRoom);}table.append(colgroup);const head=document.createElement("thead"),first=document.createElement("tr"),second=document.createElement("tr"),body=document.createElement("tbody");cell(first,"th","№",1,"number-cell");cell(second,"th","",1,"number-cell");for(const name of data.keys()){cell(first,"th",name,2);cell(second,"th","Предмет",1,"subject-cell");cell(second,"th","Каб.",1,"room-cell");}head.append(first,second);table.append(head);const max=Math.max(0,...[...data.values()].map(x=>x.length));for(let i=0;i<max;i++){const row=document.createElement("tr");cell(row,"td",String(i+1),1,"number-cell");for(const[name,lessons]of data){const isDraft=draft?.className===name&&draft.index===i,subj=isDraft?draft.value:(lessons[i]?.name||""),room=lessons[i]?.room||"";cell(row,"td",subj,1,"subject-cell");cell(row,"td",room,1,"room-cell");}body.append(row);}table.append(body);return table;}
function renderPreview(draft){const paper=id("previewPaper");paper.replaceChildren();const title=document.createElement("h3");title.textContent="Расписание уроков";paper.append(title);if(!data.size){const empty=document.createElement("p");empty.className="paper-empty";empty.textContent="Добавьте классы и уроки, чтобы увидеть сводную таблицу.";paper.append(empty);return;}paper.append(makeTable(draft));}
function renderPrint(){const area=id("printArea"),page=document.createElement("div"),title=document.createElement("h1");area.replaceChildren();page.className="print-page";title.textContent="Расписание уроков";page.append(title,makeTable());area.append(page);}
id("addClassBtn").addEventListener("click",addClass);id("classInput").addEventListener("keydown",e=>{if(e.key==="Enter")addClass();});id("addLessonBtn").addEventListener("click",()=>{if(!current)return;data.get(current).push({name:"",room:""});save();renderLessons();renderPreview();id("lessonsList").lastElementChild?.querySelector("input")?.focus();});id("deleteClassBtn").addEventListener("click",()=>{if(!current||pending)return;const name=current;if(!confirm(`Удалить класс ${name}?`))return;data.delete(name);save();const next=data.keys().next().value;if(next)selectClass(next);else{current="";id("lessonsSection").hidden=true;id("lessonsList").replaceChildren();renderTabs();renderPreview();}id("status").textContent=`Класс ${name} удалён.`;});id("modalConfirmBtn").addEventListener("click",()=>{if(pending){data.get(pending.className)[pending.index].name=pending.value;save();closeModal();renderPreview();}});id("modalCancelBtn").addEventListener("click",cancelPending);id("modalOverlay").addEventListener("keydown",e=>{if(e.key==="Escape"){cancelPending();return;}if(e.key!=="Tab")return;const first=id("modalConfirmBtn"),last=id("modalCancelBtn");if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}});id("printBtn").addEventListener("click",()=>{if(pending)return;if(!data.size){id("status").textContent="Сначала добавьте хотя бы один класс.";id("classInput").focus();return;}document.activeElement?.blur();renderPrint();window.print();});load();if(data.size)selectClass(data.keys().next().value);renderPreview();
</script>
</body>
</html>
